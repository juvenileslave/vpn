cp_placement: dedicated
client_family: v4
s2s_family: v6_prefer
egress_family: v4_prefer
egress_slots: 3
slot_fanout: ports
node_port_allow:
  - 127.0.0.1/32
  - ::1/128
  - 10.250.0.30/32
  - "fd00:db8:1::30/128"
# Explicit private management port. 2222 is only the upstream example and is
# not part of the accepted example contract (see docs/DEPLOYMENT.md).
node_api_port: 2223
base_ssh_port: 22
base_ssh_permit_root_login: "no"
# One authority for the public subscription endpoint. The panel
# SUB_PUBLIC_DOMAIN, the cp_proxy vhost server_name/path prefix and the proxy
# upstream (panel_bind:panel_port) are derived from these two values. Do not
# declare remnawave_panel_sub_public_domain, cp_proxy_server_name or
# cp_proxy_path_prefix separately: the inventory validator refuses duplicates.
subscription_public_host: sub.example.com
subscription_public_path: /sub/
# The accepted production-like contract enables the base firewall; the
# administrator bootstrap is the only explicitly scoped temporary exception.
base_firewall_enabled: true
base_ssh_trusted_cidrs:
  - 192.0.2.0/24
  - 2001:db8:10::/64
# Private L3 overlay (ADR-0001): IPv6 ULA preferred with explicit IPv4 fallback.
# Private keys are never stored in inventory; supply via SOPS/extra-vars or
# overlay_private_key_file outside the repository checkout.
overlay_backend: wireguard
overlay_interface: wg0
overlay_port: 51820
overlay_ipv6_prefix: "fd00:db8:1::/64"
overlay_ipv4_fallback: true
overlay_ipv4_prefix: 10.250.0.0/24
reality_sni: www.example.com
cover_tls_port: 9443
cover_site_source: /srv/owned-cover-site
cover_acme_email: admin@example.com
cover_acme_agree_tos: true
cover_acme_http_reachable: true
reality_max_time_diff_ms: 300000
remnawave_node_network_mode: host
xhttp_path: /xhttp
xhttp_mode: stream-one
profiles_probe_url: https://probe.example.com/generate_204
image_tags:
  remnawave_backend: "3.4.10"
  remnawave_node: "3.4.5"
