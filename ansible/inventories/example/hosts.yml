# Synthetic example topology. Documentation addresses only (RFC 5737, RFC 3849).
all:
  children:
    exit:
      hosts:
        exit-example:
          ansible_host: 192.0.2.10
          public_ipv4: 192.0.2.10
          public_ipv6: 2001:db8:10::10
          node_role: exit
    relay:
      hosts:
        relay-example:
          ansible_host: 198.51.100.20
          public_ipv4: 198.51.100.20
          public_ipv6: 2001:db8:20::20
          node_role: relay
    cp:
      hosts:
        cp-example:
          ansible_host: 203.0.113.30
          public_ipv4: 203.0.113.30
          public_ipv6: 2001:db8:30::30
          node_role: control_plane
