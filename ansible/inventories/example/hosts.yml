# Synthetic example topology. Documentation (RFC 5737, RFC 3849), ULA (fc00::/7) and RFC 1918 addresses only.
all:
  children:
    exit:
      hosts:
        exit-example:
          ansible_host: 192.0.2.10
          public_ipv4: 192.0.2.10
          public_ipv6: 2001:db8:10::10
          node_role: exit
          overlay_ipv6: "fd00:db8:1::10/128"
          overlay_ipv4: 10.250.0.10/32
    relay:
      hosts:
        relay-example:
          ansible_host: 198.51.100.20
          public_ipv4: 198.51.100.20
          public_ipv6: 2001:db8:20::20
          node_role: relay
          overlay_ipv6: "fd00:db8:1::20/128"
          overlay_ipv4: 10.250.0.20/32
    cp:
      hosts:
        cp-example:
          ansible_host: 203.0.113.30
          public_ipv4: 203.0.113.30
          public_ipv6: 2001:db8:30::30
          node_role: control_plane
          overlay_ipv6: "fd00:db8:1::30/128"
          overlay_ipv4: 10.250.0.30/32
