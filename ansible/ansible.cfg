[defaults]
inventory = inventories/example/hosts.yml
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
# Built-in callback with YAML output: the short name `yaml` exists only in
# community.general and fails to load with plain ansible-core.
stdout_callback = ansible.builtin.default

[callback_default]
# Callback options live in their own section, not in [defaults].
result_format = yaml

[inventory]
# Make `ansible-inventory --list` a real parse check instead of a warning.
unparsed_is_failed = True
any_unparsed_is_failed = True
