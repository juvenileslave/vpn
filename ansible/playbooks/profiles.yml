---
# One topology-wide offline bundle. No SSH, service, firewall or panel mutation.
- name: Validate topology before any empty host pattern can silently skip
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require exactly one exit and relay
      ansible.builtin.assert:
        that:
          - groups.get('exit', []) | length == 1
          - groups.get('relay', []) | length == 1
        fail_msg: A profile bundle requires exactly one exit and one relay.
        quiet: true

- name: Render coherent exit relay and client candidate locally
  hosts: exit
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: ../roles/profiles
