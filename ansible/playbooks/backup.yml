---
# Install encrypted panel PostgreSQL backups with a systemd timer (docs/BACKUP.md).
# Default target follows cp_placement via inventory groups; cp_backup_hosts
# overrides. Example:
#   ansible-playbook -i <inventory> playbooks/backup.yml \
#     -e cp_backup_recipients_file=/path/outside/git/recipients.txt
- name: Install encrypted panel backups
  hosts: "{{ cp_backup_hosts | default(groups['cp'] if groups['cp'] | length else groups['exit']) }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require a consistent panel host selection
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/require_panel_host.yml"
  roles:
    - role: "{{ playbook_dir }}/../roles/cp_backup"
