---
# Loopback-only Remnawave panel stack (architecture task 2.1). See docs/PANEL.md.
# cp_placement chooses the default target; remnawave_panel_hosts overrides it.
- name: Remnawave panel
  hosts: "{{ remnawave_panel_hosts | default(groups.get('cp', []) if groups.get('cp', []) | length else groups.get('exit', [])) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require a consistent panel host selection
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/require_panel_host.yml"
      vars:
        panel_hosts_override: "{{ remnawave_panel_hosts | default('') }}"
  roles:
    # Project-local path relative to this playbook; no ANSIBLE_ROLES_PATH needed.
    - role: ../roles/remnawave_panel
