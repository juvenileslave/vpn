---
# Loopback-only Remnawave panel stack (architecture task 2.1). See docs/PANEL.md.
# cp_placement chooses the default target; remnawave_panel_hosts overrides it.
- name: Remnawave panel
  hosts: "{{ remnawave_panel_hosts | default('exit' if cp_placement | default('dedicated') == 'exit' else 'cp') }}"
  gather_facts: false
  become: true
  roles:
    # Project-local path relative to this playbook; no ANSIBLE_ROLES_PATH needed.
    - role: ../roles/remnawave_panel
