---
# Subscription-page reverse proxy (architecture task 2.2). The role is resolved
# by path because ansible.cfg does not set roles_path.
- name: Subscription-page nginx proxy
  hosts: "{{ cp_proxy_hosts | default(groups.get('cp', []) if groups.get('cp', []) | length else groups.get('exit', [])) }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require a consistent panel host selection
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/require_panel_host.yml"
      vars:
        panel_hosts_override: "{{ cp_proxy_hosts | default('') }}"
  roles:
    - role: "{{ playbook_dir }}/../roles/cp_proxy"
