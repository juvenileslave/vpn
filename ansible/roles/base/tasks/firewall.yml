---
# Render/validate in a private tmpfs directory before replacing persistent state.

- name: Allocate private firewall transaction directory
  ansible.builtin.tempfile:
    state: directory
    path: /run
    prefix: vpn-base-firewall-
  register: base_firewall_transaction
  check_mode: false
  changed_when: false

- name: Initialize snapshot retention for this firewall attempt
  ansible.builtin.set_fact:
    base_firewall_retain_snapshots: false
    base_firewall_failure_task: ""
  changed_when: false

- name: Validate and commit owned firewall policy
  block:
    - name: Render and validate the complete candidate
      ansible.builtin.template:
        src: firewall.nft.j2
        dest: "{{ base_firewall_transaction.path }}/candidate.nft"
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/nft -c -f %s
      check_mode: false
      changed_when: false
      no_log: true
      diff: false

    - name: Read previous owned configuration directory metadata
      ansible.builtin.stat:
        path: /etc/vpn-base
      register: base_firewall_previous_directory

    - name: Read previous owned configuration metadata
      ansible.builtin.stat:
        path: /etc/vpn-base/firewall.nft
      register: base_firewall_previous

    - name: Read candidate metadata
      ansible.builtin.stat:
        path: "{{ base_firewall_transaction.path }}/candidate.nft"
      register: base_firewall_candidate

    - name: Check whether the owned table is loaded
      ansible.builtin.command: /usr/sbin/nft list table inet vpn_base
      register: base_firewall_live
      changed_when: false
      check_mode: false
      failed_when: base_firewall_live.rc not in [0, 1]
      no_log: true

    - name: Commit owned policy and loader with restoration on failure
      ansible.builtin.include_tasks: firewall_transaction.yml
      when: not ansible_check_mode

    - name: Report firewall changes in check mode without applying the candidate
      ansible.builtin.debug:
        msg: Проверенный кандидат изменит собственную конфигурацию или отсутствующую таблицу.
      changed_when: true
      when:
        - ansible_check_mode
        - not base_firewall_previous.stat.exists
          or base_firewall_previous.stat.checksum != base_firewall_candidate.stat.checksum
          or base_firewall_live.rc != 0

    - name: Predict firewall loader changes in check mode
      ansible.builtin.include_tasks: firewall_loader.yml
      when: ansible_check_mode
  rescue:
    - name: Propagate firewall validation or application failure
      ansible.builtin.fail:
        msg: >-
          Ошибка firewall на этапе {{ base_firewall_failure_task | default(ansible_failed_task.name, true) }}
          (rc={{ base_firewall_failure_rc if base_firewall_failure_task | length > 0 else ansible_failed_result.rc | default('не указан') }});
          последовательное применение остановлено.
          {% if base_firewall_retain_snapshots | default(false) %}
          Восстановление не завершено; закрытые резервные копии сохранены в {{ base_firewall_transaction.path }}.
          {% endif %}
  always:
    - name: Remove private firewall transaction files
      ansible.builtin.file:
        path: "{{ base_firewall_transaction.path }}"
        state: absent
      check_mode: false
      changed_when: false
      when: not (base_firewall_retain_snapshots | default(false))
