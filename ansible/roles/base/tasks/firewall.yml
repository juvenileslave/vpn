---
# Render/validate in a private tmpfs directory before replacing persistent state.
- name: Create firewall configuration directory
  ansible.builtin.file:
    path: /etc/vpn-base
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allocate private firewall transaction directory
  ansible.builtin.tempfile:
    state: directory
    path: /run
    prefix: vpn-base-firewall-
  register: base_firewall_transaction
  check_mode: false
  changed_when: false

- name: Validate and commit owned firewall policy
  block:
    - name: Render and validate the complete candidate
      ansible.builtin.template:
        src: firewall.nft.j2
        dest: "{{ base_firewall_transaction.path }}/candidate.nft"
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/nft -c -f %s
      check_mode: false
      changed_when: false
      no_log: true
      diff: false

    - name: Read previous owned configuration metadata
      ansible.builtin.stat:
        path: /etc/vpn-base/firewall.nft
      register: base_firewall_previous

    - name: Read candidate metadata
      ansible.builtin.stat:
        path: "{{ base_firewall_transaction.path }}/candidate.nft"
      register: base_firewall_candidate

    - name: Check whether the owned table is loaded
      ansible.builtin.command: /usr/sbin/nft list table inet vpn_base
      register: base_firewall_live
      changed_when: false
      check_mode: false
      failed_when: base_firewall_live.rc not in [0, 1]
      no_log: true

    - name: Commit changed configuration and table with restoration on failure
      ansible.builtin.include_tasks: firewall_transaction.yml
      when:
        - not ansible_check_mode
        - not base_firewall_previous.stat.exists
          or base_firewall_previous.stat.checksum != base_firewall_candidate.stat.checksum
          or base_firewall_live.rc != 0

    - name: Report firewall changes in check mode without applying the candidate
      ansible.builtin.debug:
        msg: Проверенный кандидат изменит собственную конфигурацию или отсутствующую таблицу.
      changed_when: true
      when:
        - ansible_check_mode
        - not base_firewall_previous.stat.exists
          or base_firewall_previous.stat.checksum != base_firewall_candidate.stat.checksum
          or base_firewall_live.rc != 0

    - name: Install firewall loader unit
      ansible.builtin.template:
        src: vpn-base-firewall.service.j2
        dest: /etc/systemd/system/vpn-base-firewall.service
        owner: root
        group: root
        mode: "0644"
      register: base_firewall_unit

    - name: Reload systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: base_firewall_unit is changed

    - name: Enable and start firewall loader
      ansible.builtin.systemd_service:
        name: vpn-base-firewall.service
        enabled: true
        state: started
      when: not (ansible_check_mode and base_firewall_unit is changed)

    - name: Verify owned table is loaded
      ansible.builtin.command: /usr/sbin/nft list table inet vpn_base
      changed_when: false
      no_log: true
      when: not ansible_check_mode
  rescue:
    - name: Propagate firewall validation or application failure
      ansible.builtin.fail:
        msg: Ошибка проверки или применения firewall; последовательное применение остановлено.
  always:
    - name: Remove private firewall transaction files
      ansible.builtin.file:
        path: "{{ base_firewall_transaction.path }}"
        state: absent
      check_mode: false
      changed_when: false
