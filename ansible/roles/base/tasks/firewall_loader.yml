---
- name: Install firewall loader unit
  ansible.builtin.template:
    src: vpn-base-firewall.service.j2
    dest: /etc/systemd/system/vpn-base-firewall.service
    owner: root
    group: root
    mode: "0644"
    follow: false
  register: base_firewall_unit

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: base_firewall_unit is changed

- name: Enable and start firewall loader
  ansible.builtin.systemd_service:
    name: vpn-base-firewall.service
    enabled: true
    state: started
  register: base_firewall_loader_start
  when: not (ansible_check_mode and base_firewall_unit is changed)

- name: Verify owned table is loaded
  ansible.builtin.command: /usr/sbin/nft list table inet vpn_base
  changed_when: false
  no_log: true
  when: not ansible_check_mode
