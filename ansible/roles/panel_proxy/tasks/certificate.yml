---
# One private CA, one short-lived leaf for the loopback name. The CA
# certificate is public material and is the only file an operator imports.
- name: Create the TLS directory
  ansible.builtin.file:
    path: "{{ panel_proxy_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the script directory
  ansible.builtin.file:
    path: "{{ panel_proxy_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the TLS bootstrap script
  ansible.builtin.copy:
    src: panel_proxy_tls.py
    dest: "{{ panel_proxy_tls_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Issue or renew the certificate
  when: not ansible_check_mode
  block:
    - name: Run the TLS bootstrap
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          - "{{ panel_proxy_tls_script }}"
          - --directory
          - "{{ panel_proxy_tls_dir }}"
          - --address
          - "{{ panel_proxy_bind }}"
          - --name
          - "{{ panel_proxy_server_name }}"
          - --ca-days
          - "{{ panel_proxy_ca_days | string }}"
          - --certificate-days
          - "{{ panel_proxy_certificate_days | string }}"
          - --renew-before-days
          - "{{ panel_proxy_renew_before_days | string }}"
      register: panel_proxy_tls
      changed_when: (panel_proxy_tls.stdout | from_json).changed
      notify: Reload nginx

    - name: Restrict key material
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ panel_proxy_tls_dir }}/ca.key"
        - "{{ panel_proxy_certificate_key }}"

- name: Install the renewal units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - panel-proxy-cert-renew.service
    - panel-proxy-cert-renew.timer
  register: panel_proxy_renew_units

- name: Enable the renewal timer
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: panel-proxy-cert-renew.timer
    enabled: true
    state: started
    daemon_reload: "{{ panel_proxy_renew_units is changed }}"

- name: Report the certificate expiry
  ansible.builtin.debug:
    msg: >-
      panel certificate expires
      {{ ((panel_proxy_tls.stdout | default('{}') | from_json).not_after) | default('unknown') }}
