---
- name: Validate variables
  ansible.builtin.import_tasks: validate.yml

- name: Install nginx from distribution packages
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Remove artifacts of the retired TLS variant
  ansible.builtin.include_tasks: cleanup.yml

- name: Render and activate the loopback site
  ansible.builtin.include_tasks: site.yml

- name: Apply pending reloads before verifying the endpoint
  ansible.builtin.meta: flush_handlers

- name: Verify the panel answers through the loopback endpoint
  when:
    - panel_proxy_verify | bool
    - not ansible_check_mode
  block:
    - name: Request the panel through nginx
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --max-time
          - "10"
          - "http://{{ panel_proxy_bind }}:{{ panel_proxy_port }}/"
      register: panel_proxy_probe
      changed_when: false
      retries: 5
      delay: 2
      until: panel_proxy_probe.rc == 0 and panel_proxy_probe.stdout | trim == '200'

    - name: Fail when the panel never answered through nginx
      ansible.builtin.assert:
        that:
          - panel_proxy_probe.rc == 0
          - panel_proxy_probe.stdout | trim == '200'
        fail_msg: >-
          http://{{ panel_proxy_bind }}:{{ panel_proxy_port }}/ did not answer 200.
          Check that the panel is running on {{ panel_proxy_upstream }} and that
          nginx is active.
        quiet: true
