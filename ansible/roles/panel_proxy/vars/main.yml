---
panel_proxy_marker: "Managed by Ansible role panel_proxy"
# nginx needs brackets around an IPv6 literal in listen.
panel_proxy_listen_address: "{{ panel_proxy_bind if '.' in panel_proxy_bind else '[' ~ panel_proxy_bind ~ ']' }}"
panel_proxy_site_available: /etc/nginx/sites-available/panel_proxy.conf
panel_proxy_site_enabled: /etc/nginx/sites-enabled/panel_proxy.conf
# Artifacts of the earlier TLS variant of this role; removed on sight so no
# certificate or private key outlives the design that required it.
panel_proxy_retired_paths:
  - /etc/panel-proxy
  - /usr/local/lib/panel-proxy
  - /etc/systemd/system/panel-proxy-cert-renew.service
  - /etc/systemd/system/panel-proxy-cert-renew.timer
