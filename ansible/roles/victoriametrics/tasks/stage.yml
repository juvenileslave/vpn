---
# Render the candidate scrape configuration and validate it with the pinned
# binary (or the installed one) before any host change. The scratch directory
# holds only non-secret rendering output and is removed in the always block.

- name: Read the installed binary version, if any
  ansible.builtin.command:
    argv: ["{{ victoriametrics_binary }}", --version]
  register: _victoriametrics_existing_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether the pinned archive must be downloaded
  ansible.builtin.set_fact:
    _victoriametrics_need_binary: >-
      {{ _victoriametrics_existing_version.rc != 0
         or victoriametrics_version not in _victoriametrics_existing_version.stdout }}

- name: Allocate the scratch directory
  ansible.builtin.tempfile:
    state: directory
    prefix: victoriametrics-
    path: /run
  register: _victoriametrics_scratch
  check_mode: false
  changed_when: false

- name: Render and dry-run the candidate scrape configuration
  block:
    - name: Render the candidate scrape configuration
      ansible.builtin.template:
        src: scrape.yml.j2
        dest: "{{ _victoriametrics_scratch.path }}/scrape.yml"
        mode: "0640"
      check_mode: false
      changed_when: false
      diff: false

    - name: Download the pinned release into the scratch directory
      ansible.builtin.get_url:
        url: "{{ victoriametrics_url }}"
        dest: "{{ _victoriametrics_scratch.path }}/{{ victoriametrics_release }}.tar.gz"
        checksum: sha256:{{ victoriametrics_checksums[victoriametrics_arch].archive }}
        mode: "0600"
        timeout: 120
      when: _victoriametrics_need_binary | bool and not ansible_check_mode
      check_mode: false
      changed_when: false

    - name: Extract the pinned release into the scratch directory
      ansible.builtin.unarchive:
        src: "{{ _victoriametrics_scratch.path }}/{{ victoriametrics_release }}.tar.gz"
        dest: "{{ _victoriametrics_scratch.path }}"
        remote_src: true
        mode: "0700"
      when: _victoriametrics_need_binary | bool and not ansible_check_mode
      check_mode: false
      changed_when: false

    # On a fresh host in check mode the binary is not downloaded, so the dry
    # run is deferred to the real run; on an existing host it still validates
    # the pending configuration without touching the service.
    - name: Dry-run the candidate scrape configuration
      ansible.builtin.command:
        argv:
          - "{{ (_victoriametrics_scratch.path ~ '/victoria-metrics-prod') if _victoriametrics_need_binary | bool else victoriametrics_binary }}"
          - "-promscrape.config={{ _victoriametrics_scratch.path }}/scrape.yml"
          - -promscrape.config.dryRun
      environment:
        GOMAXPROCS: "1"
      changed_when: false
      check_mode: false
      when: not ansible_check_mode or not (_victoriametrics_need_binary | bool)
  always:
    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ _victoriametrics_scratch.path }}"
        state: absent
      when: _victoriametrics_scratch.path is defined
      check_mode: false
      changed_when: false
