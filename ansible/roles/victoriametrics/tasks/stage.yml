---
# Render the candidate scrape configuration and validate it with the pinned
# binary (or the installed one) before any host change. The scratch files carry
# key material only transiently and are removed in the always block.

- name: Read the installed binary version, if any
  ansible.builtin.command:
    argv: ["{{ victoriametrics_binary }}", --version]
  register: _victoriametrics_existing_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether the pinned archive must be downloaded
  ansible.builtin.set_fact:
    _victoriametrics_need_binary: >-
      {{ _victoriametrics_existing_version.rc != 0
         or victoriametrics_version not in _victoriametrics_existing_version.stdout }}

- name: Allocate the scratch directory
  ansible.builtin.tempfile:
    state: directory
    prefix: victoriametrics-
    path: /run
  register: _victoriametrics_scratch
  check_mode: false
  changed_when: false

- name: Render and dry-run the candidate scrape configuration
  block:
    - name: Write the candidate panel credentials into the scratch directory
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ _victoriametrics_scratch.path }}/{{ item.name }}"
        mode: "0600"
      loop:
        - name: panel-metrics-username
          content: "{{ _victoriametrics_panel_username | default(victoriametrics_panel_metrics.username | default('')) }}"
        - name: panel-metrics-password
          content: "{{ _victoriametrics_panel_password | default(victoriametrics_panel_metrics.password | default('')) }}"
      loop_control:
        label: "candidate credential {{ item.name }}"
      when:
        - victoriametrics_panel_metrics.username_file is defined or victoriametrics_panel_metrics.username is defined
          or victoriametrics_panel_metrics.password_file is defined or victoriametrics_panel_metrics.password is defined
        - item.content | length > 0
      no_log: true
      diff: false
      check_mode: false
      changed_when: false

    - name: Render the candidate scrape configuration
      ansible.builtin.template:
        src: scrape.yml.j2
        dest: "{{ _victoriametrics_scratch.path }}/scrape.yml"
        mode: "0600"
      check_mode: false
      changed_when: false
      diff: false

    - name: Download the pinned release into the scratch directory
      ansible.builtin.get_url:
        url: "{{ victoriametrics_url }}"
        dest: "{{ _victoriametrics_scratch.path }}/{{ victoriametrics_release }}.tar.gz"
        checksum: sha256:{{ victoriametrics_checksums[victoriametrics_arch].archive }}
        mode: "0600"
        timeout: 120
      when: _victoriametrics_need_binary
      check_mode: false
      changed_when: false

    - name: Extract the pinned release into the scratch directory
      ansible.builtin.unarchive:
        src: "{{ _victoriametrics_scratch.path }}/{{ victoriametrics_release }}.tar.gz"
        dest: "{{ _victoriametrics_scratch.path }}"
        remote_src: true
        mode: "0700"
      when: _victoriametrics_need_binary
      check_mode: false
      changed_when: false

    - name: Dry-run the candidate scrape configuration
      ansible.builtin.command:
        argv:
          - "{{ (_victoriametrics_scratch.path ~ '/victoria-metrics-prod') if _victoriametrics_need_binary else victoriametrics_binary }}"
          - "-storageDataPath={{ _victoriametrics_scratch.path }}/data"
          - "-httpListenAddr=127.0.0.1:0"
          - "-promscrape.config={{ _victoriametrics_scratch.path }}/scrape.yml"
          - -promscrape.config.dryRun
      environment:
        GOMAXPROCS: "1"
      changed_when: false
      check_mode: false
  always:
    - name: Remove the scratch directory with candidate credentials
      ansible.builtin.file:
        path: "{{ _victoriametrics_scratch.path }}"
        state: absent
      when: _victoriametrics_scratch.path is defined
      check_mode: false
      changed_when: false
      no_log: true
