---
- name: Create the victoriametrics system group
  ansible.builtin.group:
    name: "{{ victoriametrics_group }}"
    system: true

- name: Create the victoriametrics system user
  ansible.builtin.user:
    name: "{{ victoriametrics_user }}"
    group: "{{ victoriametrics_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ victoriametrics_data_dir }}"
    create_home: false

- name: Create the persistent data directory
  ansible.builtin.file:
    path: "{{ victoriametrics_data_dir }}"
    state: directory
    owner: "{{ victoriametrics_user }}"
    group: "{{ victoriametrics_group }}"
    mode: "0750"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ victoriametrics_config_dir }}"
    state: directory
    owner: root
    group: "{{ victoriametrics_group }}"
    mode: "0750"

- name: Create the installation directory
  ansible.builtin.file:
    path: "{{ victoriametrics_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned VictoriaMetrics release and verify the checksum
  ansible.builtin.get_url:
    url: "{{ victoriametrics_url }}"
    dest: "{{ victoriametrics_archive }}"
    checksum: sha256:{{ victoriametrics_checksums[victoriametrics_arch].archive }}
    owner: root
    group: root
    mode: "0644"
    timeout: 120
  register: victoriametrics_download
  when: not ansible_check_mode

# In check mode on a fresh host neither the directory nor the archive exists.
- name: Extract the pinned VictoriaMetrics release
  ansible.builtin.unarchive:
    src: "{{ victoriametrics_archive }}"
    dest: "{{ victoriametrics_base_dir }}"
    remote_src: true
    creates: "{{ victoriametrics_binary }}"
    owner: root
    group: root
  when: not ansible_check_mode

- name: Verify the extracted binary checksum
  ansible.builtin.stat:
    path: "{{ victoriametrics_binary }}"
    checksum_algorithm: sha256
  register: _victoriametrics_binary_stat
  when: not ansible_check_mode

- name: Require the pinned binary checksum
  ansible.builtin.assert:
    that: >-
      _victoriametrics_binary_stat.stat.exists
      and _victoriametrics_binary_stat.stat.checksum
          == victoriametrics_checksums[victoriametrics_arch].victoria_metrics_prod
    fail_msg: >-
      The installed victoria-metrics-prod binary does not match the pinned
      checksum; refusing to start it.
    quiet: true
  when: not ansible_check_mode

- name: Install the scrape configuration
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ victoriametrics_config_dir }}/scrape.yml"
    owner: root
    group: "{{ victoriametrics_group }}"
    mode: "0640"
  register: victoriametrics_scrape_file

- name: Install the panel credential files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ victoriametrics_config_dir }}/{{ item.name }}"
    owner: root
    group: "{{ victoriametrics_group }}"
    mode: "0600"
  loop:
    - name: panel-metrics-username
      content: "{{ _victoriametrics_panel_username | default(victoriametrics_panel_metrics.username | default('')) }}"
    - name: panel-metrics-password
      content: "{{ _victoriametrics_panel_password | default(victoriametrics_panel_metrics.password | default('')) }}"
  loop_control:
    label: "credential {{ item.name }}"
  when:
    - victoriametrics_panel_metrics.username_file is defined or victoriametrics_panel_metrics.username is defined
      or victoriametrics_panel_metrics.password_file is defined or victoriametrics_panel_metrics.password is defined
    - item.content | length > 0
  register: victoriametrics_credential_files
  no_log: true
  diff: false

- name: Remove stale panel credential files without credentials
  ansible.builtin.file:
    path: "{{ victoriametrics_config_dir }}/{{ item }}"
    state: absent
  loop:
    - panel-metrics-username
    - panel-metrics-password
  when: >-
    victoriametrics_panel_metrics.username_file is not defined
    and victoriametrics_panel_metrics.username is not defined
    and victoriametrics_panel_metrics.password_file is not defined
    and victoriametrics_panel_metrics.password is not defined

- name: Install the systemd unit
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: "{{ victoriametrics_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: victoriametrics_unit

- name: Verify the systemd unit
  ansible.builtin.command:
    argv: [systemd-analyze, verify, "{{ victoriametrics_unit_path }}"]
  changed_when: false

# A unit that is new in check mode does not exist yet, so systemd cannot query it.
- name: Enable and start victoriametrics
  ansible.builtin.systemd_service:
    name: victoriametrics.service
    enabled: true
    state: started
    daemon_reload: "{{ victoriametrics_unit is changed }}"
  register: victoriametrics_service
  when: not (ansible_check_mode and victoriametrics_unit is changed)

- name: Report the restart that check mode skips
  ansible.builtin.debug:
    msg: >-
      victoriametrics.service would be restarted here; check mode writes no
      configuration.
  when:
    - ansible_check_mode
    - victoriametrics_service is not skipped
    - (victoriametrics_unit is changed or victoriametrics_scrape_file is changed)
  changed_when: true

# A service started with the new unit or config does not need a restart.
- name: Restart victoriametrics after unit or scrape config change
  ansible.builtin.systemd_service:
    name: victoriametrics.service
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - victoriametrics_service is not skipped
    - victoriametrics_service is not changed
    - victoriametrics_unit is changed or victoriametrics_scrape_file is changed
      or victoriametrics_credential_files is changed
