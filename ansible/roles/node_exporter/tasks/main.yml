- name: Validate node_exporter listen address
  ansible.builtin.set_fact:
    node_exporter_listen_ip: "{{ node_exporter_listen_address | node_exporter_ip }}"

- name: Reject unsupported platforms before any change
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture in node_exporter_arch_map
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: >-
      node_exporter role supports only Linux with systemd on
      {{ node_exporter_arch_map.keys() | join(', ') }}; found
      {{ ansible_facts.system }}/{{ ansible_facts.architecture }}/{{ ansible_facts.service_mgr }}
    quiet: true

- name: Reject listen settings that cannot be bound on this host
  ansible.builtin.assert:
    that:
      - node_exporter_listen_port >= 1
      - node_exporter_listen_port <= 65535
      - >-
        node_exporter_listen_ip.loopback
        or node_exporter_listen_ip.address in (ansible_facts.all_ipv4_addresses | default([])
        + ansible_facts.all_ipv6_addresses | default([]))
    fail_msg: >-
      node_exporter_listen_port must be 1-65535 and node_exporter_listen_address
      must be a loopback address or an address assigned to this host
    quiet: true

- name: Compose node_exporter listen socket
  ansible.builtin.set_fact:
    node_exporter_listen: >-
      {{ ('[' ~ node_exporter_listen_ip.address ~ ']') if node_exporter_listen_ip.version == 6
      else node_exporter_listen_ip.address }}:{{ node_exporter_listen_port }}

- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create node_exporter installation directory
  ansible.builtin.file:
    path: "{{ node_exporter_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download pinned node_exporter release and verify checksum
  ansible.builtin.get_url:
    url: "{{ node_exporter_url }}"
    dest: "{{ node_exporter_archive }}"
    checksum: sha256:{{ node_exporter_checksums[node_exporter_arch] }}
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  register: node_exporter_download

# In check mode on a fresh host the archive was not actually downloaded.
- name: Extract node_exporter release
  ansible.builtin.unarchive:
    src: "{{ node_exporter_archive }}"
    dest: "{{ node_exporter_base_dir }}"
    remote_src: true
    creates: "{{ node_exporter_binary }}"
    owner: root
    group: root
  when: not (ansible_check_mode and node_exporter_download is changed)

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "{{ node_exporter_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_unit
  notify: Restart node_exporter

# A unit that is new in check mode does not exist yet, so systemd cannot query it.
- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    enabled: true
    state: started
    daemon_reload: "{{ node_exporter_unit is changed }}"
  register: node_exporter_service
  when: not (ansible_check_mode and node_exporter_unit is changed)
