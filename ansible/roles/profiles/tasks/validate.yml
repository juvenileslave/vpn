---
# All checks run before anything is written. Messages name the variable and,
# for non-secret inputs, the offending value; secret values are never echoed.

- name: Check egress_family
  ansible.builtin.assert:
    that:
      - egress_family is defined
      - egress_family is string
      - egress_family in profiles_egress_domain_strategy
    fail_msg: >-
      egress_family must be one of {{ profiles_egress_domain_strategy | list | join(', ') }}
      (got {{ egress_family | default('<undefined>') | to_json }})
    quiet: true

- name: Check egress_slots
  ansible.builtin.assert:
    that:
      - egress_slots is defined
      - egress_slots is integer or (egress_slots is string and egress_slots is match(profiles_port_regex))
      - egress_slots | int >= 1
      - egress_slots | int <= 6
    fail_msg: >-
      egress_slots must be an integer from 1 through 6 (slots egress-0..egress-5)
      (got {{ egress_slots | default('<undefined>') | to_json }})
    quiet: true

- name: Check listener ports
  ansible.builtin.assert:
    that:
      - _port != '<undefined>'
      - _port is integer or (_port is string and _port is match(profiles_port_regex))
      - _port | int >= 1
      - _port | int <= 65535
    fail_msg: "{{ item }} must be an integer from 1 through 65535 (got {{ _port | to_json }})"
    quiet: true
  loop:
    - exit_direct_port
    - transit_port
  vars:
    _port: "{{ lookup('ansible.builtin.vars', item, default='<undefined>') }}"

- name: Check that direct and transit ports differ
  ansible.builtin.assert:
    that:
      - exit_direct_port | int != transit_port | int
    fail_msg: "exit_direct_port and transit_port must differ (both are {{ exit_direct_port | int }})"
    quiet: true

- name: Check reality_sni
  ansible.builtin.assert:
    that:
      - reality_sni is defined
      - reality_sni is string
      - reality_sni is match(profiles_dns_name_regex)
      - "'.' in reality_sni"
    fail_msg: "reality_sni must be a DNS name (got {{ reality_sni | default('<undefined>') | to_json }})"
    quiet: true

- name: Check reality_target format
  ansible.builtin.assert:
    that:
      - reality_target is defined
      - reality_target is string
      - reality_target is match(profiles_target_regex)
      - reality_target.rsplit(':', 1)[1] | int >= 1
      - reality_target.rsplit(':', 1)[1] | int <= 65535
    fail_msg: >-
      reality_target must be host:port or [ipv6]:port with port 1..65535
      (got {{ reality_target | default('<undefined>') | to_json }})
    quiet: true

# A loopback REALITY target on one of our own listener ports would loop back
# into Xray instead of reaching the camouflage server.
- name: Check that reality_target does not point at a profile listener
  ansible.builtin.assert:
    that:
      - >-
        not (_target_host in ['localhost', '::1', '0.0.0.0', '::'] or _target_host.startswith('127.'))
        or _target_port | int not in [exit_direct_port | int, transit_port | int]
    fail_msg: >-
      reality_target {{ reality_target | to_json }} points at a local profile listener
      (exit_direct_port {{ exit_direct_port | int }}, transit_port {{ transit_port | int }})
    quiet: true
  vars:
    _target_host: "{{ reality_target.rsplit(':', 1)[0] | regex_replace('^\\[|\\]$', '') | lower }}"
    _target_port: "{{ reality_target.rsplit(':', 1)[1] }}"

- name: Check xhttp_path
  ansible.builtin.assert:
    that:
      - xhttp_path is defined
      - xhttp_path is string
      - xhttp_path is match('^/\\S*$')
    fail_msg: "xhttp_path must start with / and contain no whitespace (got {{ xhttp_path | default('<undefined>') | to_json }})"
    quiet: true

- name: Check xhttp_mode
  ansible.builtin.assert:
    that:
      - xhttp_mode is defined
      - xhttp_mode == profiles_required_xhttp_mode
    fail_msg: >-
      the exit profiles require xhttp_mode {{ profiles_required_xhttp_mode }}
      (got {{ xhttp_mode | default('<undefined>') | to_json }})
    quiet: true

# Secret checks: messages describe the constraint only.
- name: Check reality_private_key
  ansible.builtin.assert:
    that:
      - reality_private_key is defined
      - reality_private_key is string
      - reality_private_key is match(profiles_private_key_regex)
    fail_msg: "reality_private_key must be supplied as a 43-character base64url X25519 private key (value not shown)"
    quiet: true

- name: Check reality_short_ids
  ansible.builtin.assert:
    that:
      - reality_short_ids is defined
      - reality_short_ids is sequence
      - reality_short_ids is not string
      - reality_short_ids is not mapping
      - reality_short_ids | length >= 1
      - reality_short_ids | reject('string') | list | length == 0
      - reality_short_ids | reject('match', profiles_short_id_regex) | list | length == 0
      - reality_short_ids | unique | length == reality_short_ids | length
    fail_msg: >-
      reality_short_ids must be a non-empty list of unique lowercase hex strings
      of even length, 2..16 characters (values not shown)
    quiet: true

- name: Check client UUID lists
  ansible.builtin.assert:
    that:
      - _ids != '<undefined>'
      - _ids is sequence
      - _ids is not string
      - _ids is not mapping
      - _ids | length >= 1
      - _ids | reject('string') | list | length == 0
      - _ids | reject('match', profiles_uuid_regex) | list | length == 0
      - _ids | unique | length == _ids | length
    fail_msg: "{{ item }} must be a non-empty list of unique lowercase UUIDs (values not shown)"
    quiet: true
  loop:
    - exit_direct_client_ids
    - transit_client_ids
  vars:
    _ids: "{{ lookup('ansible.builtin.vars', item, default='<undefined>') }}"

- name: Check transit service user count
  ansible.builtin.assert:
    that:
      - transit_client_ids | length == egress_slots | int
    fail_msg: >-
      transit_client_ids must contain exactly egress_slots ({{ egress_slots | int }}) UUIDs,
      one per service user egress-0..egress-{{ egress_slots | int - 1 }}
      (got {{ transit_client_ids | length }})
    quiet: true

- name: Check that direct and transit clients do not share UUIDs
  ansible.builtin.assert:
    that:
      - exit_direct_client_ids | intersect(transit_client_ids) | length == 0
    fail_msg: "exit_direct_client_ids and transit_client_ids must not share UUIDs (values not shown)"
    quiet: true
