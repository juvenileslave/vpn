---
- name: Require exactly one exit and relay before evaluating any output
  ansible.builtin.assert:
    that:
      - groups.get('exit', []) | length == 1
      - groups.get('relay', []) | length == 1
    fail_msg: A profile bundle requires exactly one exit and one relay.
    quiet: true
  run_once: true

- name: Validate and render one coherent versioned candidate locally
  profile_bundle:
    topology:
      exit: "{{ hostvars[groups['exit'][0]] | dict2items | selectattr('key', 'in', profiles_host_keys) | items2dict }}"
      relay: "{{ hostvars[groups['relay'][0]] | dict2items | selectattr('key', 'in', profiles_host_keys) | items2dict }}"
      egress_slots: "{{ egress_slots }}"
      egress_family: "{{ egress_family }}"
      s2s_family: "{{ s2s_family }}"
      slot_fanout: "{{ slot_fanout }}"
      xhttp_path: "{{ xhttp_path }}"
      xhttp_mode: "{{ xhttp_mode }}"
      profiles_probe_url: "{{ profiles_probe_url }}"
    credentials:
      profiles_credentials: "{{ profiles_credentials }}"
      exit_direct_client_ids: "{{ exit_direct_client_ids }}"
      transit_client_ids: "{{ transit_client_ids }}"
      relay_client_ids: "{{ relay_client_ids }}"
      profiles_user_slots: "{{ profiles_user_slots }}"
      profiles_upstreams: "{{ profiles_upstreams }}"
      profiles_revoked_client_ids: "{{ profiles_revoked_client_ids }}"
    output_dir: "{{ profiles_output_dir }}"
  no_log: true
  diff: false
  run_once: true
