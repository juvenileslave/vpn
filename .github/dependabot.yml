version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      python-tooling:
        patterns: ['*']
