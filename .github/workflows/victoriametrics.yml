name: VictoriaMetrics role

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  victoriametrics:
    name: victoriametrics role
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ansible
    steps:
      - name: Получить публичные файлы
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Установить закреплённый ansible-core
        working-directory: .
        run: make -C ansible bootstrap
      - name: Unit-тесты фильтров роли
        run: ../.venv/bin/python -m unittest discover --start-directory roles/victoriametrics/tests --pattern 'test_*.py' --verbose
      - name: Проверить синтаксис playbook
        run: ../.venv/bin/ansible-playbook --syntax-check playbooks/victoriametrics.yml
      # GitHub-hosted runner — одноразовая VM с systemd: роль применяется
      # только к нему, включая полный сервисный и сетевой сценарий.
      - name: Отклонить wildcard-адрес и не-ACL не-loopback до изменений
        run: |
          PLAYBOOK=(../.venv/bin/ansible-playbook -i localhost, -c local
            -e victoriametrics_hosts=all playbooks/victoriametrics.yml)
          if "${PLAYBOOK[@]}" -e victoriametrics_listen_address=0.0.0.0; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_listen_address=10.203.46.1 \
              -e '{"victoriametrics_allowed_sources": ["10.203.46.2/32"]}'; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_listen_address=10.203.46.1 \
              -e '{"victoriametrics_allowed_sources": ["0.0.0.0/0"]}'; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_retention=12; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_retention=infd; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_retention=1h; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_scrape_interval=0s; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_memory_max=0M; then exit 1; fi
          if "${PLAYBOOK[@]}" -e victoriametrics_cpu_quota=0%; then exit 1; fi
          if "${PLAYBOOK[@]}" -e '{"victoriametrics_scrape_nodes": ["bad target"]}'; then exit 1; fi
          test ! -e /opt/victoriametrics && test ! -e /var/lib/victoriametrics
      - name: Check mode на чистом runner
        run: |
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            playbooks/victoriametrics.yml --check --diff | tee "$RUNNER_TEMP/check.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=[1-9][0-9]* +unreachable=0 +failed=0 ' "$RUNNER_TEMP/check.log"
          test ! -e /opt/victoriametrics
          test ! -e /var/lib/victoriametrics
          test ! -e /etc/systemd/system/victoriametrics.service
          if getent passwd victoriametrics; then exit 1; fi
      - name: Установить принятый node_exporter и применить роль
        run: |
          set -euo pipefail
          ../.venv/bin/ansible-playbook -i localhost, -c local playbooks/node_exporter.yml
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            -e '{"victoriametrics_scrape_nodes": ["localhost"]}' playbooks/victoriametrics.yml
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            -e '{"victoriametrics_scrape_nodes": ["localhost"]}' playbooks/victoriametrics.yml \
            | tee "$RUNNER_TEMP/second.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' "$RUNNER_TEMP/second.log"
      - name: Проверить версию, сервис, права, retention и метрики
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8428/health | grep -q OK
          test "$(ss -Hltn 'sport = :8428' | wc -l)" -eq 1
          grep -q ' 127\.0\.0\.1:8428 ' <(ss -Hltn 'sport = :8428')
          systemctl is-active victoriametrics.service
          pid="$(systemctl show --property=MainPID --value victoriametrics.service)"
          test "$pid" != 0
          test "$(ps -o uid= -p "$pid" | tr -d ' ')" = "$(id -u victoriametrics)"
          stat -c '%a %U' /var/lib/victoriametrics | grep -q '^750 victoriametrics$'
          test "$(sudo stat -c '%a' /etc/victoriametrics/scrape.yml)" = 640
          tr '\0' ' ' <"/proc/$pid/cmdline" | grep -q -- '-retentionPeriod=30d'
          tr '\0' ' ' <"/proc/$pid/cmdline" | grep -q -- '-httpListenAddr=127.0.0.1:8428'
          systemctl show --property=MemoryMax --value victoriametrics.service | grep -qx 536870912
          systemctl show --property=CPUQuotaPerSecUSec --value victoriametrics.service | grep -qx 500ms
          query_value() {
            curl --fail --silent --show-error --noproxy '*' --get \
              --data-urlencode "query=$1" http://127.0.0.1:8428/api/v1/query \
              | ../.venv/bin/python -c 'import json, sys; d = json.load(sys.stdin); sys.exit(not (d["status"] == "success" and any(row["value"][1] == sys.argv[1] for row in d["data"]["result"])))' "$2"
          }
          wait_query() {
            for _ in $(seq 1 90); do
              if query_value "$1" "$2"; then return; fi
              sleep 1
            done
            echo "query did not return the expected sample: $1" >&2
            exit 1
          }
          # В instant-vector value — массив [timestamp, "значение"].
          # Первый скрейп и видимость свежих точек требуют ожидания.
          wait_query 'up{job="node_exporter",instance="localhost:9100"}' 1
          wait_query 'up{job="victoriametrics"}' 1
          # Персистентность: вставка, перезапуск сервиса, повторный запрос.
          curl --fail --silent --show-error -X POST http://127.0.0.1:8428/api/v1/import/prometheus \
            --data-binary 'vm_acceptance_probe{host="disposable"} 42'
          wait_query vm_acceptance_probe 42
          sudo systemctl restart victoriametrics.service
          for _ in $(seq 1 30); do
            curl --fail --silent --show-error http://127.0.0.1:8428/health >/dev/null 2>&1 && break
            sleep 1
          done
          wait_query vm_acceptance_probe 42
          # Слушатель по-прежнему только loopback.
          if ss -Hltn | grep -v 127.0.0.1 | grep -q 8428; then exit 1; fi

      - name: Проверить check mode установленной роли и оба cp_placement
        run: |
          set -euo pipefail
          pid="$(systemctl show --property=MainPID --value victoriametrics.service)"
          files="$(sudo sha256sum /etc/victoriametrics/scrape.yml /etc/systemd/system/victoriametrics.service)"
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            -e '{"victoriametrics_scrape_nodes": ["localhost"], "victoriametrics_retention": "31d"}' \
            playbooks/victoriametrics.yml --check --diff | tee "$RUNNER_TEMP/installed-check.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=[1-9][0-9]* +unreachable=0 +failed=0 ' "$RUNNER_TEMP/installed-check.log"
          test "$(systemctl show --property=MainPID --value victoriametrics.service)" = "$pid"
          test "$(sudo sha256sum /etc/victoriametrics/scrape.yml /etc/systemd/system/victoriametrics.service)" = "$files"
          for placement in dedicated exit; do
            cp_hosts='{}'
            exit_hosts='{}'
            HOSTS=()
            if test "$placement" = dedicated; then
              cp_hosts='{localhost: {ansible_connection: local, ansible_python_interpreter: /usr/bin/python3}}'
            else
              exit_hosts='{localhost: {ansible_connection: local, ansible_python_interpreter: /usr/bin/python3}}'
              HOSTS=(-e victoriametrics_hosts=exit)
            fi
            cat > "$RUNNER_TEMP/metrics-$placement.yml" <<EOF
          all:
            vars:
              cp_placement: $placement
            children:
              cp: {hosts: $cp_hosts}
              exit: {hosts: $exit_hosts}
              relay: {hosts: {}}
          EOF
            ../.venv/bin/ansible-playbook -i "$RUNNER_TEMP/metrics-$placement.yml" \
              "${HOSTS[@]}" -e '{"victoriametrics_scrape_nodes": ["localhost"]}' \
              playbooks/victoriametrics.yml | tee "$RUNNER_TEMP/placement-$placement.log"
            grep -Eq '^localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' "$RUNNER_TEMP/placement-$placement.log"
          done

      - name: Проверить IPv6 loopback и настройку retention
        run: |
          set -euo pipefail
          PLAYBOOK=(../.venv/bin/ansible-playbook -i localhost, -c local
            -e victoriametrics_hosts=all -e '{"victoriametrics_scrape_nodes": ["localhost"]}'
            playbooks/victoriametrics.yml)
          "${PLAYBOOK[@]}" -e victoriametrics_listen_address=::1 -e victoriametrics_retention=31d
          curl --fail --silent --show-error --noproxy '*' 'http://[::1]:8428/health' | grep -q OK
          pid="$(systemctl show --property=MainPID --value victoriametrics.service)"
          tr '\0' ' ' <"/proc/$pid/cmdline" | grep -q -- '-retentionPeriod=31d'
          "${PLAYBOOK[@]}" -e victoriametrics_listen_address=::1 -e victoriametrics_retention=31d \
            | tee "$RUNNER_TEMP/ipv6-second.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' "$RUNNER_TEMP/ipv6-second.log"
          "${PLAYBOOK[@]}"

      - name: Проверить source ACL на не-loopback адресе через роль base
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2
          cleanup() {
            sudo ip netns del vm-cp 2>/dev/null || true
            sudo ip netns del vm-unrelated 2>/dev/null || true
            sudo nft delete table inet vpn_base 2>/dev/null || true
          }
          trap cleanup EXIT
          # veth-пара, моделирующая CP-источник и посторонний источник.
          sudo ip netns add vm-cp
          sudo ip netns add vm-unrelated
          sudo ip link add vm-cp0 type veth peer name vm-cp1
          sudo ip link set vm-cp1 netns vm-cp
          sudo ip addr add 10.203.46.1/30 dev vm-cp0
          sudo ip link set vm-cp0 up
          sudo ip netns exec vm-cp ip addr add 10.203.46.2/30 dev vm-cp1
          sudo ip netns exec vm-cp ip link set vm-cp1 up
          sudo ip netns exec vm-cp ip link set lo up
          sudo ip link add vm-un0 type veth peer name vm-un1
          sudo ip link set vm-un1 netns vm-unrelated
          sudo ip addr add 10.203.47.1/30 dev vm-un0
          sudo ip link set vm-un0 up
          sudo ip netns exec vm-unrelated ip addr add 10.203.47.2/30 dev vm-un1
          sudo ip netns exec vm-unrelated ip link set vm-un1 up
          sudo ip netns exec vm-unrelated ip link set lo up
          sudo ip netns exec vm-unrelated ip route add 10.203.46.1/32 via 10.203.47.1
          sleep 2
          # Принятая политика base: только CP-источник на порт запросов.
          cat > "$RUNNER_TEMP/base-firewall.yml" <<EOF
          - name: Disposable base firewall policy
            hosts: localhost
            connection: local
            gather_facts: false
            become: true
            tasks:
              - name: Apply the accepted base firewall
                ansible.builtin.include_role:
                  name: $GITHUB_WORKSPACE/ansible/roles/base
                  tasks_from: firewall.yml
          EOF
          ACL='{"base_firewall_enabled": true,
            "base_firewall_vpn_ports": [],
            "base_firewall_source_ports": [{"proto": "tcp", "port": 8428,
              "source_cidrs": ["10.203.46.2/32"]}],
            "base_ssh_port": 22, "base_ssh_trusted_cidrs": []}'
          ../.venv/bin/ansible-playbook -i localhost, -c local \
            -e "$ACL" "$RUNNER_TEMP/base-firewall.yml"
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            -e '{"victoriametrics_scrape_nodes": ["localhost"]}' -e "$ACL" \
            -e '{"victoriametrics_listen_address": "10.203.46.1",
                 "victoriametrics_allowed_sources": ["10.203.46.2/32"]}' \
            playbooks/victoriametrics.yml | tee "$RUNNER_TEMP/acl.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=[1-9][0-9]* +unreachable=0 +failed=0 ' "$RUNNER_TEMP/acl.log"
          ../.venv/bin/ansible-playbook -i localhost, -c local -e victoriametrics_hosts=all \
            -e '{"victoriametrics_scrape_nodes": ["localhost"]}' -e "$ACL" \
            -e '{"victoriametrics_listen_address": "10.203.46.1",
                 "victoriametrics_allowed_sources": ["10.203.46.2/32"]}' \
            playbooks/victoriametrics.yml | tee "$RUNNER_TEMP/acl-second.log"
          grep -Eq '^localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' "$RUNNER_TEMP/acl-second.log"
          # Ровно один сокет на объявленном приватном адресе.
          test "$(ss -Hltn 'sport = :8428' | wc -l)" -eq 1
          grep -q ' 10\.203\.46\.1:8428 ' <(ss -Hltn 'sport = :8428')
          # Объявленный CP-источник получает ответ.
          sudo ip netns exec vm-cp curl --fail --silent --show-error --max-time 10 \
            http://10.203.46.1:8428/health | grep -q OK
          sudo ip netns exec vm-cp curl --fail --silent --show-error --noproxy '*' --max-time 10 \
            --get --data-urlencode 'query=up{job="node_exporter"}' http://10.203.46.1:8428/api/v1/query \
            | ../.venv/bin/python -c 'import json, sys; d = json.load(sys.stdin); sys.exit(not (d["status"] == "success" and any(row["value"][1] == "1" for row in d["data"]["result"])))'
          # Посторонний источник не достигает API.
          if sudo ip netns exec vm-unrelated curl --silent --show-error --noproxy '*' --max-time 3 \
               http://10.203.46.1:8428/health; then
            echo "unrelated source reached the query API" >&2
            exit 1
          fi
