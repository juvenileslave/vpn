name: panel_proxy role

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  panel-proxy-role:
    name: panel_proxy role
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить публичные файлы
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Установить закреплённый ansible-core
        run: make -C ansible bootstrap
      - name: Unit-тесты роли
        run: .venv/bin/python -m unittest discover -s ansible/roles/panel_proxy/tests -p 'test_*.py' -v
      - name: Разбор playbook
        run: cd ansible && ../.venv/bin/ansible-playbook -i inventories/example/hosts.yml playbooks/panel_proxy.yml --syntax-check
