# Синтетический пример конфигурации vpnctl. Адреса и имена — только
# документационные (RFC 5737, RFC 3849, example.com); это не рабочие серверы.
panel:
  url: https://panel.example.com
  # Имя переменной окружения с API-токеном панели, а не сам токен.
  token_env: VPNCTL_PANEL_TOKEN
nodes:
  - name: exit-01
    role: exit
    address: 192.0.2.10
    port: 443
  - name: relay-01
    role: relay
    address: 2001:db8::10
    port: 443
  - name: cp-01
    role: cp
    address: cp.example.com
    port: 8443
probe:
  timeout: 5s
  interval: 60s
log_level: info

bot:
  # Имя переменной окружения с токеном Telegram-бота, а не сам токен.
  token_env: VPNCTL_BOT_TOKEN
  # SQLite-база с offset и обработанными update_id (создаётся при запуске).
  state_db: state.db
  # Необязательный адрес Bot API: https-хост или loopback http для
  # self-hosted сервера и тестового fake API. По умолчанию api.telegram.org.
  # api_base: http://127.0.0.1:8081
  # Allowlist: положительные числовые Telegram user ID; роли admin и viewer.
  operators:
    - id: 100000001
      role: admin
    - id: 100000002
      role: viewer
  # Необязательные явно разрешённые не-private чаты (например, группа).
  chat_ids: [-1000000000001]
